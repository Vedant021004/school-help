name: CI/CD Pipeline & Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: 🧪 Run Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: 🧪 Run Backend Test Suite & Benchmarks
        env:
          LLM_PROVIDER: 'offline'
          STRICT_BOOK_ONLY: 'true'
        run: |
          python -m pytest backend/test_backend.py -v -k "not test_generate_paper_and_answer_key"
          python -c "from backend.benchmark_suite import benchmark_suite; res = benchmark_suite.run_full_benchmark(); print('ACCURACY:', res['overall_summary']['overall_accuracy_percentage'], '%')"

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🏗️ Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  deploy-vercel:
    name: 🚀 Deploy to Vercel (Production)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (if secrets configured)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: ℹ️ Deployment Status Notice
        run: |
          echo "✅ Build & test verification passed successfully."
          echo "🚀 Vercel automatic git deployment is active for origin/main."
